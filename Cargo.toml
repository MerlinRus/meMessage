[package]
name = "iphone-bridge"
version = "0.6.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "links"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.41", features = ["serialize"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_Bluetooth", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation"] }
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation", "Win32_Storage_FileSystem", "UI_ViewManagement", "Win32_Graphics_Dwm", "Devices_Bluetooth", "Devices_Bluetooth_Rfcomm", "Storage_Streams"] }
raw-window-handle = "0.6"
winreg = "0.55"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
rfd = { version = "0.17", default-features = false }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
